<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        body{
            background-color: rgb(154, 52, 142);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

        }
        section{
            border: none;
            background-color: rgb(13, 6, 40);
            color: white;
            width: 400px;
            height: 200px;
            border-radius: 25px;
            font-size: 13px;
        }

        div h1{
            text-align: center;
            margin: 20px 10px;
        }
        .faq{
            border: none;
            background-color: rgb(95, 89, 128);
            display: flex;
            margin: 21px 26px;
            padding: 9px;
            border-radius: 0.3rem;
            font-size: 14px;
            justify-content: space-between;
            align-items: center;
        }
        .faq i{
            font-size: 8px;
        }
    </style>
</head>
<body>
    <section>
        <div class="head">
            <div>
                <h1>FAQ</h1>
            </div>
            <div class="faq">
                Do tou offer international shipping?
                <i class="fa-solid fa-plus"></i>
            </div>
            <div class="faq">
                Can I change my order?
                <i class="fa-solid fa-plus"></i>
            </div>
        </div>
    </section>
</body>
</html>
